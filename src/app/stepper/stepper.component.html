<div class="progress mb-4">
  <div class="progress-bar" role="progressbar" [style.width.%]="(currentStep - 1) * 50"></div>
</div>

<!-- Step 1: Consultation Type -->
<div class="card shadow-sm" *ngIf="currentStep === 1">
  <div class="card-header">Étape 1: Motif de la consultation</div>
  <div class="card-body" [formGroup]="firstFormGroup">
    <p class="card-text">Choisissez le type de consultation.</p>
    <div class="form-check" *ngFor="let type of ['Première consultation', 'Consultation de suivi', 'Urgence']">
      <input class="form-check-input" type="radio" name="consultationType" [value]="type" formControlName="consultationType">
      <label class="form-check-label">{{ type }}</label>
    </div>
    <div class="d-flex justify-content-end mt-3">
      <button class="btn btn-primary" (click)="nextStep()" [disabled]="firstFormGroup.invalid">Suivant</button>
    </div>
  </div>
</div>

<!-- Step 2: Date and Time -->
<div class="card shadow-sm" *ngIf="currentStep === 2">
  <div class="card-header">Étape 2: Choix de la date et de l'heure</div>
  <div class="card-body" [formGroup]="secondFormGroup">
    <div class="mb-3">
      <label for="appointmentDate" class="form-label">Date du rendez-vous</label>
      <p-calendar formControlName="appointmentDate" [showIcon]="true" class="small-calendar"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Heure du rendez-vous</label>
      <div class="d-flex flex-wrap gap-2">
        <div *ngFor="let time of availableTimes">
          <input type="radio" class="btn-check" name="appointmentTime" [id]="'time-' + time" [value]="time" formControlName="appointmentTime">
          <label class="btn btn-outline-primary" [for]="'time-' + time">{{ time }}</label>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-secondary" (click)="prevStep()">Précédent</button>
      <button class="btn btn-primary" (click)="nextStep()" [disabled]="secondFormGroup.invalid">Suivant</button>
    </div>
  </div>
</div>


<!-- Step 3: Patient Information -->
<div class="card shadow-sm" *ngIf="currentStep === 3">
  <div class="card-header">Étape 3: Vos informations</div>
  <div class="card-body" [formGroup]="thirdFormGroup">
    <div class="mb-3">
      <label for="patientName" class="form-label">Nom complet</label>
      <input type="text" class="form-control" id="patientName" formControlName="patientName">
    </div>
    <div class="mb-3">
      <label for="patientEmail" class="form-label">Adresse e-mail</label>
      <input type="email" class="form-control" id="patientEmail" formControlName="patientEmail">
    </div>
    <div class="mb-3">
      <label for="patientPhone" class="form-label">Numéro de téléphone</label>
      <input type="tel" class="form-control" id="patientPhone" formControlName="patientPhone">
    </div>
    <div class="d-flex justify-content-between mt-3">
      <button class="btn btn-secondary" (click)="prevStep()">Précédent</button>
      <button class="btn btn-success" (click)="submit()" [disabled]="thirdFormGroup.invalid">Confirmer le rendez-vous</button>
    </div>
  </div>
</div>
